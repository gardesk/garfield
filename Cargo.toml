[workspace]
resolver = "2"
members = [
    "garfield",
    "garfieldctl",
    "garfield-ipc",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["mfwolffe"]
license = "MIT"
repository = "https://github.com/mfwolffe/gardesk"

[workspace.dependencies]
# UI toolkit
gartk-core = { path = "../gartk/gartk-core" }
gartk-x11 = { path = "../gartk/gartk-x11" }
gartk-render = { path = "../gartk/gartk-render" }

# X11
x11rb = { version = "0.13", features = ["allow-unsafe-code"] }

# System
libc = "0.2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI
clap = { version = "4.5", features = ["derive"] }

# File system
dirs = "6.0"
chrono = "0.4"
walkdir = "2.5"

# Desktop entries
freedesktop_entry_parser = "1.3"

# Fuzzy matching
nucleo-matcher = "0.3"

# Image handling
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "ico"] }

# PDF rendering
poppler-rs = "0.25"
cairo-rs = { version = "0.21", features = ["png"] }

# IPC types (shared between crates)
garfield-ipc = { path = "garfield-ipc" }
